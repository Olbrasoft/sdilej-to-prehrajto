name: pilot-plan

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Pilot size"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "10"

concurrency:
  group: sdilej-to-prehrajto-source-preparation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      HF_HOME: /tmp/huggingface
      SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
      SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
      PREHRAJTO_EMAIL: ${{ secrets.PREHRAJTO_EMAIL }}
      PREHRAJTO_PASSWORD: ${{ secrets.PREHRAJTO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: whisper-small-${{ runner.os }}-v1
      - name: Verify or install media runtime
        timeout-minutes: 12
        run: python3 scripts/ensure_media_runtime.py
      - name: Install runtime
        timeout-minutes: 10
        run: |
          pip install ".[whisper]"
      - name: Configure durable source checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build upload plan without uploading
        run: >-
          sdilej-sync plan
          --limit "${{ inputs.batch_size }}"
          --persist-git-state
      - name: Publish approval digest
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("artifacts/plan.json", encoding="utf-8"))
          print(f"Plan SHA-256: `{data['plan_sha']}`")
          print(f"\nPlanned films: {len(data['films'])}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-plan-${{ inputs.batch_size }}
          path: artifacts/
          if-no-files-found: error

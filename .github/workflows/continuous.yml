name: continuous-sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: sdilej-to-prehrajto-transfer
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CONTINUOUS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      HF_HOME: /tmp/huggingface
      CONTINUOUS_ENABLED: ${{ vars.CONTINUOUS_ENABLED }}
      SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
      SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
      PREHRAJTO_EMAIL: ${{ secrets.PREHRAJTO_EMAIL }}
      PREHRAJTO_PASSWORD: ${{ secrets.PREHRAJTO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: whisper-small-${{ runner.os }}-v1
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install ".[whisper]"
      - name: Configure durable state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Upload next verified batch
        run: >-
          sdilej-sync continuous
          --limit "${{ vars.CONTINUOUS_BATCH_SIZE || '25' }}"
          --persist-git-state
